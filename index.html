<!DOCTYPE html>
<html lang="pt-BR" class="notranslate" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Aço - Ferramentas</title>
    <link rel="icon" href="/lovable-uploads/ca14aac8-6439-4661-9952-a61c72ced23e.png" type="image/png">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a365d" />
    <meta name="description" content="Ferramentas de análise comercial e gestão para Global Aço" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Global Aço" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="Global Aço - Ferramentas" />
    <meta property="og:description" content="Ferramentas de análise comercial e gestão para Global Aço" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@globalaco" />
    <meta name="twitter:image" content="/icon-512x512.png" />

    <!-- Loading da marca: aparece antes do JavaScript terminar de carregar -->
    <link rel="preload" href="/brand/globo.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="/brand/loader.css" />
  </head>

  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="brand-loader__stage">
          <span class="brand-loader__glow" aria-hidden="true"></span>
          <svg class="brand-loader__ring" viewBox="0 0 160 160" aria-hidden="true">
            <defs>
              <linearGradient id="bootArc" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
                <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#0ea5e9" />
              </linearGradient>
            </defs>
            <circle cx="80" cy="80" r="74" class="brand-loader__track" />
            <circle cx="80" cy="80" r="74" class="brand-loader__arc" stroke="url(#bootArc)" />
          </svg>
          <img class="brand-loader__globe" src="/brand/globo.webp" alt="Global Aço" />
        </div>
        <p class="boot-loader__brand">Global Aço</p>
        <p class="boot-loader__text">Abrindo o Globinho<span class="brand-loader__dots"><span>.</span><span>.</span><span>.</span></span></p>
        <div class="brand-loader__bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Unregister any previously installed service workers safely without reload loops -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          })
          .catch((err) => console.warn('Error unregistering service worker:', err));
      }
    </script>
  </body>
</html>
